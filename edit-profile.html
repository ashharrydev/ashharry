<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile | ASH.harry</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="help-page">

<header class="help-header">

<div class="logo-box">
<img src="logo.png" class="logo" alt="Logo">
<h2>ASH.harry</h2>
</div>

<a href="settings.html" class="back-btn">← Settings</a>

</header>

<section class="help-hero">

<img src="profile.png"
style="width:120px;height:120px;border-radius:50%;border:4px solid #05A357;object-fit:cover;">

<h1>Edit Profile</h1>

<p>Update your account information.</p>

</section>

<div class="help-categories">

<div class="help-card">

<label>Full Name</label>
<input type="text" placeholder="Your Name">

<br><br>

<label>Email</label>
<input type="email" placeholder="your@email.com">

<br><br>

<label>Bio</label>
<textarea placeholder="Write something about yourself..." rows="4" style="width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;"></textarea>

<br><br>

<label>Country</label>
<input type="text" placeholder="India">

<br><br>

<button class="login-main-btn">
💾 Save Changes
</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
