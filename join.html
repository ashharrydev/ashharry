<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join | ASH.harry</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-page">

<header class="login-header">

<div class="logo-box">
<img src="logo.png" class="logo">
<h2>ASH.harry</h2>
</div>

<div class="header-buttons">

<button class="lang-btn">
<img src="us-flag.png" alt="English">
<span>English</span>
</button>

<a href="login.html" class="join-btn">Log in</a>

</div>

</header>

<div class="login-container">

<h1>Create account.</h1>

<div class="social-login">

<button class="google-btn">
<img src="google.png" alt="Google">
<span>Continue with Google</span>
</button>

<button class="apple-btn">
<img src="apple.png" alt="Apple">
</button>

<button class="facebook-btn">
<img src="facebook.png" alt="Facebook">
</button>

</div>

<div class="divider">
<span>Or, create an account with your email</span>
</div>

<label>First Name</label>
<input type="text" placeholder="First Name">

<label>Last Name</label>
<input type="text" placeholder="Last Name">

<label>Email</label>
<input type="email" placeholder="name@email.com">

<label>Password</label>

<div class="password-box">
<input type="password" placeholder="Password">
<span class="eye">👁️</span>
</div>

<label>Confirm Password</label>

<div class="password-box">
<input type="password" placeholder="Confirm Password">
<span class="eye">👁️</span>
</div>

<button class="login-main-btn">
Create Account
</button>

<p style="text-align:center;margin-top:20px;">
Already have an account?
<a href="login.html">Log in</a>
</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
