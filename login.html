<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | ASH.harry</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-page">

<header class="login-header">

<div class="logo-box">
<img src="logo.png" class="logo">
<h2>ASH.harry</h2>
</div>

<div class="header-buttons">

<button class="lang-btn">
    <img src="us-flag.png" alt="English">
    <span>English</span>
</button>

<a href="join.html" class="join-btn">Join</a>

</div>

</header>

<div class="login-container">

<h1>Welcome back.</h1>

<div class="social-login">

<button class="google-btn">
<img src="google.png" alt="Google">
<span>Log in with Google</span>
</button>

<button class="apple-btn">
<img src="apple.png" alt="Apple">
</button>

<button class="facebook-btn">
<img src="facebook.png" alt="Facebook">
</button>

</div>

<div class="divider">
<span>Or, log in with your email</span>
</div>

<label>Email</label>

<input type="email" placeholder="name@email.com">

<label>Password</label>

<div class="password-box">
<input type="password" placeholder="Password">
<span class="eye">👁️</span>
</div>

<a href="#" class="forgot-link">
Forgot your password?
</a>

<button class="login-main-btn">
Log in
</button>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
