<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | ASH.harry</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-page">

<header class="login-header">

<div class="logo-box">
<img src="logo.png" class="logo">
<h2>ASH.harry</h2>
</div>

<div class="header-buttons">

<button class="lang-btn">
    <img src="us-flag.png" alt="English">
    <span>English</span>
</button>

<a href="join.html" class="join-btn">Join</a>

</div>

</header>

<div class="login-container">

<h1>Welcome back.</h1>

<div class="social-login">

<button id="googleLoginBtn" class="google-btn">
<img src="google.png" alt="Google">
<span>Log in with Google</span>
</button>

<button class="apple-btn">
<img src="apple.png" alt="Apple">
</button>

<button class="facebook-btn">
<img src="facebook.png" alt="Facebook">
</button>

</div>

<div class="divider">
<span>Or, log in with your email</span>
</div>

<label>Email</label>

<input type="email" placeholder="name@email.com">

<label>Password</label>

<div class="password-box">
<input type="password" placeholder="Password">
<span class="eye">👁️</span>
</div>

<a href="#" class="forgot-link">
Forgot your password?
</a>

<button class="login-main-btn">
Log in
</button>

</div>

</div>

<script src="script.js"></script>
<script type="module">
  // 1. Firebase इम्पोर्ट करें
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

  // 2. आपका Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyA_xzJyzKI-rQFfCopu-GRQaIITU8rGvxM",
    authDomain: "ash-harry-5c77f.firebaseapp.com",
    projectId: "ash-harry-5c77f",
    storageBucket: "ash-harry-5c77f.firebasestorage.app",
    messagingSenderId: "465749262084",
    appId: "1:465749262084:web:5b7703f832162dec4e1a51",
    measurementId: "G-XGC2YSEVMN"
  };

  // 3. Firebase चालू करें
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // 4. लॉगिन बटन पर क्लिक का कोड
  const googleBtn = document.getElementById("googleLoginBtn");

  if(googleBtn) {
    googleBtn.addEventListener("click", (e) => {
      e.preventDefault();
      
      signInWithPopup(auth, provider)
        .then((result) => {
          const user = result.user;
          alert("लॉगिन सफल हुआ! आपका स्वागत है, " + user.displayName);
          
          // लॉगिन होने के बाद वापस होम पेज पर भेजने के लिए:
          window.location.href = "index.html"; 
        })
        .catch((error) => {
          console.error("लॉगिन एरर:", error);
          alert("लॉगिन फेल हो गया: " + error.message);
        });
    });
  }
</script>
    
</body>
</html>
